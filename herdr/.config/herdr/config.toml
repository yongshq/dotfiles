# herdr configuration — ~/.config/herdr/config.toml
#
# This file only sets a few overrides; everything else uses herdr's
# defaults. See the full annotated reference (148 keys) any time with:
#
#     herdr --default-config
#
# Prefix stays ctrl+b (same as tmux), so muscle memory carries over.

[theme]
# Matches the Catppuccin theme used in ~/.config/ghostty/config.
name = "catppuccin"

[terminal]
# New panes/tabs/workspaces open in the current pane's directory.
new_cwd = "follow"

[keys]
# Pane navigation: keep the default vim-style prefix chords AND add
# prefix-free alt+h/j/k/l for instant, one-chord pane switching.
focus_pane_left  = ["prefix+h", "alt+h"]
focus_pane_down  = ["prefix+j", "alt+j"]
focus_pane_up    = ["prefix+k", "alt+k"]
focus_pane_right = ["prefix+l", "alt+l"]

# Pane layouts, via the `layouts` plugin (iurysza/herdr-pane-layouts).
# Install with: herdr plugin install iurysza/herdr-pane-layouts --yes
#
# Why equalize is worth a binding: resize (built-in prefix+r, and the plugin's
# own resize actions) pushes whichever border sits on the given side OUTWARD.
# For a pane with neighbours on both sides that only ever grows it — to shrink
# one you have to focus a neighbour and grow that instead. Restoring even
# columns by hand is fiddly enough to want one key.
[[keys.command]]
key = "prefix+shift+e"
type = "plugin_action"
command = "layouts.equalize"
description = "equalize panes as vertical columns"

[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "layouts.cycle"
description = "cycle pane layouts"
