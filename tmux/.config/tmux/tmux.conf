# ~/.config/tmux/tmux.conf

# ── Colors / terminal ────────────────────────────────────────────────
# tmux advertises itself as tmux-256color; the terminal-features line
# below tells tmux that the OUTER terminal (Ghostty) supports truecolor
# (RGB) and styled underlines. This is the only Ghostty-specific bit.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-ghostty:usstyle"

# ── Prefix ───────────────────────────────────────────────────────────
# Default prefix is C-b. Uncomment to use C-a instead (screen-style):
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# ── General QoL ──────────────────────────────────────────────────────
set -g mouse on                 # click/scroll/resize with the mouse
set -g base-index 1             # windows start at 1
setw -g pane-base-index 1       # panes start at 1
set -g renumber-windows on      # keep window numbers gapless
set -g history-limit 50000      # bigger scrollback
set -sg escape-time 10          # snappier ESC (matters for vim/nvim)
set -g focus-events on          # let apps know when a pane gains focus
set -g set-clipboard on         # yank straight to the system clipboard

# ── Splits: keep the current directory ───────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── vi-style copy mode ───────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ── Agent alerts (approximation of Herdr's blocked/done notifications) ─
# tmux is NOT agent-aware. But if a program in a pane rings the terminal
# bell, tmux can flag it. Claude Code does this when you set
#   preferredNotifChannel: "terminal_bell"   in ~/.claude/settings.json
# Then a bell in any background window gets a status-bar "!" flag and the
# beep passes through to Ghostty. Note: tmux can't tell "needs an answer"
# apart from "finished" — both just ring the bell.
set -g monitor-bell on          # watch panes/windows for the bell
set -g bell-action any          # alert on a bell from any window
set -g visual-bell off          # let the audible beep reach Ghostty
set -g allow-passthrough on     # let OSC desktop notifications through too
set -g window-status-bell-style "fg=red,bold"

# ── Reload config ────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
